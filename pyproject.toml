[project]
name = "epubgen"
version = "0.1.0"
description = "Generate professional EPUB books from a topic + style via the Anthropic API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mjbeswick" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "questionary>=2.0.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "vl-convert-python>=1.6.0",
]

[project.optional-dependencies]
image = ["pillow>=10.0.0", "openai>=1.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
epubgen = "epubgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epubgen"]

[tool.hatch.build.targets.wheel.shared-data]
"src/epubgen/styles" = "epubgen/styles"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
