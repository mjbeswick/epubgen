<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="1600" height="2400" fill="#f4ecd8"/>

  <!-- Top brand bar -->
  <rect x="0" y="0" width="1600" height="200" fill="#003a5d"/>
  <text x="800" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#f4ecd8" font-weight="bold" letter-spacing="3">O'REILLY</text>

  <!-- Bottom footer bar -->
  <rect x="0" y="2200" width="1600" height="200" fill="#003a5d"/>

  <!-- Illustration area (centered square, ~1024x1024) -->
  <g id="illustration-area" x="288" y="588" width="1024" height="1024">
    <!-- Placeholder rectangle for illustration -->
    <rect x="288" y="588" width="1024" height="1024" fill="#e8dcc8" opacity="0.5"/>
    <text x="800" y="1100" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#003a5d" opacity="0.3">Illustration</text>
  </g>

  <!-- Decorative rule line -->
  <line x1="400" y1="520" x2="1200" y2="520" stroke="#003a5d" stroke-width="3" opacity="0.3"/>
  <line x1="400" y1="1650" x2="1200" y2="1650" stroke="#003a5d" stroke-width="3" opacity="0.3"/>

  <!-- Title and subtitle will be injected by the cover generation code -->
  <!-- This is a template structure; actual content is added via composite_illustration_into_svg -->
</svg>
